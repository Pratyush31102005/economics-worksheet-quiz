<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Practice Studio · Economics of Health & Education</title><style>:root{--ink:#193b34;--green:#235d49;--paper:#f6f7f1;--muted:#6e7c73;--line:#dce2d8;--lime:#ddedac}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 'Segoe UI',sans-serif}header{max-width:1240px;margin:auto;padding:24px 32px;display:flex;align-items:center;gap:25px;border-bottom:1px solid var(--line)}a{color:inherit;text-decoration:none}#brand{font-size:21px;font-weight:700;display:flex;align-items:center;gap:10px}.logo{background:var(--green);color:white;border-radius:12px;width:39px;height:39px;text-align:center;font-size:27px}.course{font-size:10px;letter-spacing:2px;margin-left:auto;color:var(--muted)}button,select,input{font:inherit}button{cursor:pointer;background:white;border:1px solid var(--line);padding:11px 18px;border-radius:10px;color:var(--ink);font-weight:600}button:hover{border-color:var(--green);background:#edf2e6}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #97b44b;outline-offset:3px}button:disabled{opacity:.45;cursor:default}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#164a38}.ghost{background:transparent}main{max-width:1176px;margin:45px auto;padding:0 24px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--green)}h1{font-size:clamp(34px,5vw,58px);line-height:1.12;letter-spacing:-2px;font-weight:600;margin:14px 0 20px}h2{font-size:24px;line-height:1.3;margin:8px 0 12px}h3{font-size:19px;line-height:1.3;margin:12px 0}p{color:var(--muted)}.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:60px;align-items:center;margin-bottom:40px}.hero p{max-width:540px}.full{background:var(--green);border-radius:20px;padding:29px;color:white;position:relative;overflow:hidden}.full p{color:#d2e2d4}.full .eyebrow{color:var(--lime)}.full button{background:var(--lime);border:0}.full:after{content:'↗';position:absolute;right:20px;top:0;font-size:100px;color:#ffffff12;pointer-events:none}.stats{display:flex;gap:35px;border-block:1px solid var(--line);padding:20px 0;margin-bottom:38px}.stat strong{font-size:26px;margin-right:8px}.stat span{font-size:13px;color:var(--muted)}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.section-head p{font-size:13px;margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:23px;display:flex;flex-direction:column}.card p{font-size:13px;margin:0 0 22px}.card button{margin-top:auto;display:flex;justify-content:space-between;background:transparent}.week{font-size:11px;letter-spacing:1.5px;color:var(--muted)}.badge{font-size:11px;background:#edf2e6;padding:3px 8px;border-radius:20px;float:right}.toolbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:13px;margin-bottom:24px}select{padding:8px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink)}.quiz-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px}.question{background:white;padding:32px;border:1px solid var(--line);border-radius:17px}.question h2{font-size:23px;margin:20px 0 26px}.option{display:flex;width:100%;text-align:left;align-items:center;gap:14px;margin:12px 0;padding:15px;font-weight:400;line-height:1.5}.letter{border:1px solid var(--line);border-radius:7px;min-width:32px;height:32px;display:grid;place-items:center;font-weight:600}.selected{background:#e8efda;border-color:#68874c}.correct{background:#e4f1e6;border-color:#44885c}.wrong{background:#fff0eb;border-color:#d39178}.feedback{padding:16px;background:#f1f5e9;border-radius:10px;margin-top:20px}.actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:25px}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-height:360px;overflow:auto;padding:3px}.palette button{padding:7px 0;font-size:12px}.active{outline:2px solid var(--green)}.done{background:var(--lime)}.flag{border-color:#c79434;background:#fff7d9}.side{background:#edf0e7;padding:20px;border-radius:16px;align-self:start}.side p{font-size:12px}.timer{font-size:25px;font-variant-numeric:tabular-nums}.progress{height:5px;background:var(--line);border-radius:4px;margin:16px 0}.progress span{display:block;background:var(--green);height:100%;border-radius:4px}footer{text-align:center;font-size:11px;color:var(--muted);padding:28px}.result-top{background:var(--green);color:white;border-radius:20px;padding:32px;margin-bottom:25px}.result-top p{color:#d1e3d3}.result-top h1{margin:8px 0}.review{margin:16px 0}.review summary{cursor:pointer;font-weight:600}.review p{font-size:14px}.note{font-size:12px}.warning{background:#fff3d5;padding:12px;border-radius:8px;color:#765b1f}.empty{padding:25px;background:white;border-radius:12px}@media(max-width:850px){.hero{gap:25px}.grid{grid-template-columns:repeat(2,1fr)}.course{display:none}.quiz-layout{grid-template-columns:1fr}.side{order:2}.palette{grid-template-columns:repeat(10,1fr)}header{justify-content:space-between}}@media(max-width:550px){header{padding:18px}.hero,.grid{grid-template-columns:1fr}.hero{gap:20px}.stats{gap:16px;justify-content:space-between}.stat strong{display:block}.stat span{font-size:11px}main{margin-top:27px;padding:0 17px}.question{padding:21px}.question h2{font-size:20px}.section-head{display:block}.palette{grid-template-columns:repeat(8,1fr)}h1{letter-spacing:-1px}}

</style></head><body><header><a href="#" id="brand"><span class="logo">p.</span> practice studio</a><span class="course">ECONOMICS OF HEALTH & EDUCATION</span><button id="home">Dashboard ↗</button></header><main id="app"></main><footer>Built from your 12 supplied worksheets · Answers follow the provided solution keys.<br>Progress stays in this browser. No account needed for local use.</footer><script>const QUESTIONS = [{"id": "w1q1", "week": 1, "number": 1, "question": "Which of the following is NOT a valid reason for promoting human development and poverty eradication?", "options": [{"key": "a", "text": "Greater human development leads to better physical environment"}, {"key": "b", "text": "Greater human development leads to greater social stability"}, {"key": "c", "text": "Human development is valuable in itself"}, {"key": "d", "text": "Greater human development leads to higher cost of healthcare"}], "answer": "d", "source": "Week 1 Assignment 1 - Ronit Hazarika.pdf"}, {"id": "w1q2", "week": 1, "number": 2, "question": "Which of thew following statements are FALSE?", "options": [{"key": "a", "text": "Higher income often enlarges a person’s set of choices"}, {"key": "b", "text": "Higher income always translates to higher intrinsic well being"}, {"key": "c", "text": "National income figures do not represent all socially valuable achievements"}, {"key": "d", "text": "Fast growing nations sometimes fail to reduce deprivations in health and education"}], "answer": "b", "source": "Week 1 Assignment 1 - Ronit Hazarika.pdf"}, {"id": "w1q3", "week": 1, "number": 3, "question": "Below are three statements: i. Investments on health and education may or may not push growth depending on the quality of public institutions. ii. Higher education can lead to higher life expectancy iii. Medical advances have generally made a bigger impact on health indicators than non-medical developments Which of the above statements are true?", "options": [{"key": "a", "text": "Only i. and ii."}, {"key": "b", "text": "Only ii. and iii."}, {"key": "c", "text": "Only i. and iii."}, {"key": "d", "text": "Only iii."}], "answer": "a", "source": "Week 1 Assignment 1 - Ronit Hazarika.pdf"}, {"id": "w1q4", "week": 1, "number": 4, "question": "Which of the following statements reflects the philosophy of the UN’s human development reports?", "options": [{"key": "a", "text": "Income has an intrinsic value"}, {"key": "b", "text": "National income does not always reflect well-being of a nation"}, {"key": "c", "text": "Non-material aspects of a country’s wellbeing can be best addressed by pushing income higher"}, {"key": "d", "text": "Income growth is not an important goal for nations"}], "answer": "b", "source": "Week 1 Assignment 1 - Ronit Hazarika.pdf"}, {"id": "w1q5", "week": 1, "number": 5, "question": "Which of the following is NOT a rationale for mid-day meals provided in government run schools in India?", "options": [{"key": "a", "text": "Better nourished children can pay more attention in the classroom"}, {"key": "b", "text": "Mid-day meals take care of malnourishment in children"}, {"key": "c", "text": "Mid-day meals increase the attendance of children in schools"}, {"key": "d", "text": "Mid-day meals increase the knowledge of children regarding different meal ingredients"}], "answer": "d", "source": "Week 1 Assignment 1 - Ronit Hazarika.pdf"}, {"id": "w1q6", "week": 1, "number": 6, "question": "The theory of education as creation of minimum capabilities was proposed by", "options": [{"key": "a", "text": "Theodore Schultz"}, {"key": "b", "text": "Abhijit Banerjee"}, {"key": "c", "text": "Amartya Sen"}, {"key": "d", "text": "Gary Becker"}], "answer": "c", "source": "Week 1 Assignment 1 - Ronit Hazarika.pdf"}, {"id": "w1q7", "week": 1, "number": 7, "question": "Which of the following statements is TRUE?", "options": [{"key": "a", "text": "Secondary schooling may be sometimes thought of as a commodity, but tertiary schooling is better thought of as an investment"}, {"key": "b", "text": "The marginal benefit of an extra year of schooling in tertiary education is always higher than foregone opportunities"}, {"key": "c", "text": "The risk of moral hazard in human capital is less than physical capital, which is why it is more desirable"}, {"key": "d", "text": "Human capital can be resold or mortgaged just like physical capital"}], "answer": "a", "source": "Week 1 Assignment 1 - Ronit Hazarika.pdf"}, {"id": "w1q8", "week": 1, "number": 8, "question": "If the demand for technical skills rises in an economy, then the curve representing the marginal returns (or return schedule) to education will:", "options": [{"key": "a", "text": "Shift to the left and lower down"}, {"key": "b", "text": "Shift to the right and higher up"}, {"key": "c", "text": "Inverse in orientation"}, {"key": "d", "text": "Stay the same"}], "answer": "b", "source": "Week 1 Assignment 1 - Ronit Hazarika.pdf"}, {"id": "w1q9", "week": 1, "number": 9, "question": "If the non-monetary costs of education rise, then the cost schedule curve:", "options": [{"key": "a", "text": "Drops"}, {"key": "b", "text": "Becomes downward sloping"}, {"key": "c", "text": "Becomes straighter"}, {"key": "d", "text": "Rises"}], "answer": "d", "source": "Week 1 Assignment 1 - Ronit Hazarika.pdf"}, {"id": "w1q10", "week": 1, "number": 10, "question": "Which of the following statements is TRUE?", "options": [{"key": "a", "text": "Health is a human right and not an investment"}, {"key": "b", "text": "Education is valuable as an investment and not as an intrinsic good"}, {"key": "c", "text": "The World Development Report 1993 advocated for reduction in state expenditures on tertiary care"}, {"key": "d", "text": "The Multi-Dimensional Poverty Index (MPI) measures income"}], "answer": "c", "source": "Week 1 Assignment 1 - Ronit Hazarika.pdf"}, {"id": "w2q1", "week": 2, "number": 1, "question": "Which of the following is NOT a typical government intervention in healthcare markets?", "options": [{"key": "a", "text": "Examining the competence of healthcare professionals"}, {"key": "b", "text": "Price regulation for healthcare products"}, {"key": "c", "text": "Making some surgical procedures mandatory for most citizens"}, {"key": "d", "text": "Providing affordable health insurance for citizens"}], "answer": "c", "source": "Week 2 Assignment 2 - Ronit Hazarika.pdf"}, {"id": "w2q2", "week": 2, "number": 2, "question": "Which of the following is NOT a disease for which incidence of disease is relatively higher?", "options": [{"key": "a", "text": "Malaria"}, {"key": "b", "text": "Japanese Encephalitis"}, {"key": "c", "text": "Coronary artery disease"}, {"key": "d", "text": "None of the above"}], "answer": "c", "source": "Week 2 Assignment 2 - Ronit Hazarika.pdf"}, {"id": "w2q3", "week": 2, "number": 3, "question": "Which of the following is true?", "options": [{"key": "a", "text": "While patient-consumers face uncertainty regarding the timing of health, they do not face uncertainty regarding the outcome of a choice of treatment"}, {"key": "b", "text": "Governments are equally strict in their regulation when it comes to regulating medicines as well as licensing new surgical procedures"}, {"key": "c", "text": "Any uncertainty faced by the doctor-provider regarding the outcome of the choice of treatment is caused by a lack of competence of the doctor-provider"}, {"key": "d", "text": "Governments are stricter in regulating new medicines and drugs, but are more liberal in licensing new surgical techniques"}], "answer": "d", "source": "Week 2 Assignment 2 - Ronit Hazarika.pdf"}, {"id": "w2q4", "week": 2, "number": 4, "question": "Why is the asymmetry of knowledge a serious aspect when it comes to choosing products and services in healthcare?", "options": [{"key": "a", "text": "The doctor as a healthcare provider should know more about medicine than a patient who is a mere consumer"}, {"key": "b", "text": "The desire for profits can lead to inoptimal healthcare choices by the doctor on behalf of the patient"}, {"key": "c", "text": "Asymmetry of knowledge between products and services leads to imbalance"}, {"key": "d", "text": "Greater the asymmetry of knowledge, greater the likelihood of better healthcare choices by the doctor on behalf of the patient"}], "answer": "b", "source": "Week 2 Assignment 2 - Ronit Hazarika.pdf"}, {"id": "w2q5", "week": 2, "number": 5, "question": "Which of the following is NOT an implication of the seven key assumptions of a perfect market?", "options": [{"key": "a", "text": "Buyers and sellers know each other very well on a personal level"}, {"key": "b", "text": "A person can join a business or leave a business with little to no additional costs other than typical business costs"}, {"key": "c", "text": "Prices of goods and services are decided by the larger market for that good or service"}, {"key": "d", "text": "The purchase/use of a good or service only benefits or harms the person who purchased/used it"}], "answer": "a", "source": "Week 2 Assignment 2 - Ronit Hazarika.pdf"}, {"id": "w2q6", "week": 2, "number": 6, "question": "If healthcare markets satisfied ALL the conditions of a perfect market, which of the following CANNOT be true?", "options": [{"key": "a", "text": "Doctors would be selfishly motivated"}, {"key": "b", "text": "Patients would know as much about the pros and cons of healthcare procedures as the doctor"}, {"key": "c", "text": "There would be strict regulations to prevent medical malpractice"}, {"key": "d", "text": "Different health products may have different likelihoods of successfully treating a patient’s condition"}], "answer": "c", "source": "Week 2 Assignment 2 - Ronit Hazarika.pdf"}, {"id": "w2q7", "week": 2, "number": 7, "question": "What does product homogeneity imply?", "options": [{"key": "a", "text": "Products with the same essential formulation are priced differently based on branding"}, {"key": "b", "text": "Drug manufacturers of similar drugs would compete with each other based on price only"}, {"key": "c", "text": "People will be less likely to buy any particular brand of medicine simply because it is priced more"}, {"key": "d", "text": "All of the above"}], "answer": "b", "source": "Week 2 Assignment 2 - Ronit Hazarika.pdf"}, {"id": "w2q8", "week": 2, "number": 8, "question": "What are inferior goods?", "options": [{"key": "a", "text": "Goods that are bought less when the income of a consumer drops"}, {"key": "b", "text": "Goods that are sold less when the income of a buyer rises"}, {"key": "c", "text": "Goods that are bought more when the income of a consumer drops"}, {"key": "d", "text": "Goods that are bought for more by producer but sold for less by producer"}], "answer": "c", "source": "Week 2 Assignment 2 - Ronit Hazarika.pdf"}, {"id": "w2q9", "week": 2, "number": 9, "question": "What does an indifference curve represent?", "options": [{"key": "a", "text": "A curve with all points representing combinations of goods that the consumer would be indifferent about whether to buy or not buy"}, {"key": "b", "text": "A curve with all points representing different combinations of goods, such that all combinations are all equally preferred by a consumer"}, {"key": "c", "text": "A curve with points representing different combinations of goods such that the preference of combinations represented by points lower down the slope is less"}, {"key": "d", "text": "A curve with points representing the same combination of goods, except the preference of the consumer is higher for one point as compared to another"}], "answer": "b", "source": "Week 2 Assignment 2 - Ronit Hazarika.pdf"}, {"id": "w2q10", "week": 2, "number": 10, "question": "Which of the following are FALSE?", "options": [{"key": "a", "text": "Grossman’s extended utility function takes into how people choose between investing in health and consumption"}, {"key": "b", "text": "In Grossman’s model, health is both an investment good and a consumption good"}, {"key": "c", "text": "On a budget line, consumers typically choose a combination at a point which intersects a utility curve at exactly one point"}, {"key": "d", "text": "In Grossman’s model, health does not depreciate over time"}], "answer": "d", "source": "Week 2 Assignment 2 - Ronit Hazarika.pdf"}, {"id": "w3q1", "week": 3, "number": 1, "question": "Which of the following is TRUE?", "options": [{"key": "a", "text": "Health consumption is relatively inelastic, when compared to things like restaurant meals and going to the cinema"}, {"key": "b", "text": "Price elasticity of demand measures how much the price of a good needs to increase to decrease its demand by 1%."}, {"key": "c", "text": "Price elasticity of demand for healthcare has a positive sign because healthcare leads to positive outcomes"}, {"key": "d", "text": "Positive price elasticity of demand implies high elasticity while negative price elasticity of demand implies low elasticity or inelastic conditions"}], "answer": "a", "source": "Week 3 Assignment 3 - Ronit Hazarika.pdf"}, {"id": "w3q2", "week": 3, "number": 2, "question": "In the single-period utility equation in the Grossman model,", "options": [{"key": "a", "text": "Healthcare expenditure appears directly as an investment"}, {"key": "b", "text": "The composite/home good includes only those expenditures which indicate unhealthy consumption"}, {"key": "c", "text": "Health stock appears as a capital good"}, {"key": "d", "text": "Health and non-health goods are variables in a function that determine utility at time t"}], "answer": "d", "source": "Week 3 Assignment 3 - Ronit Hazarika.pdf"}, {"id": "w3q3", "week": 3, "number": 3, "question": "Which of the following is FALSE?", "options": [{"key": "a", "text": "In Grossman’s model, the consumer of healthcare is a completely rational person who always maximizes their utility"}, {"key": "b", "text": "Maximizing your utility involves choosing the ‘best’ combination of healthcare consumption and non-health-increasing consumption at any time"}, {"key": "c", "text": "Grossman’s model assumes perfect knowledge of all health-related events by the patient-consumer"}, {"key": "d", "text": "Grossman’s model assumes that consumers of healthcare are mostly insensitive to the price of healthcare"}], "answer": "c", "source": "Week 3 Assignment 3 - Ronit Hazarika.pdf"}, {"id": "w3q4", "week": 3, "number": 4, "question": "The Barker Hypothesis or the Thrifty Phenotype hypothesis would NOT imply that the best way to increase the health of a population would be to", "options": [{"key": "a", "text": "Increase maternal/prenatal healthcare"}, {"key": "b", "text": "Decrease childhood disease"}, {"key": "c", "text": "Decrease chronic disease burden"}, {"key": "d", "text": "Improve child nutrition"}], "answer": "c", "source": "Week 3 Assignment 3 - Ronit Hazarika.pdf"}, {"id": "w3q5", "week": 3, "number": 5, "question": "In Grossman’s model,", "options": [{"key": "a", "text": "The variables health and home goods can always be purchased in a market"}, {"key": "b", "text": "There is no way to account for time lost due to an accident or surgery"}, {"key": "c", "text": "Health and non-health consumption are both flow goods"}, {"key": "d", "text": "There is a time constraint"}], "answer": "d", "source": "Week 3 Assignment 3 - Ronit Hazarika.pdf"}, {"id": "w3q6", "week": 3, "number": 6, "question": "Which of the following is FALSE?", "options": [{"key": "a", "text": "The RAND HIE experiment showed that the demand curve for healthcare is indeed downward sloping"}, {"key": "b", "text": "The RAND HIE experiment diversified spending on healthcare by changing the retail prices of drugs and procedures"}, {"key": "c", "text": "The RAND HIE experiment showed that subsidized healthcare benefits all classes of society"}, {"key": "d", "text": "The RAND HIE experiment demonstrated a moral hazard – health insurance coverage incentivizes people to opt for unnecessary health services"}], "answer": "b", "source": "Week 3 Assignment 3 - Ronit Hazarika.pdf"}, {"id": "w3q7", "week": 3, "number": 7, "question": "Which of the following is FALSE", "options": [{"key": "a", "text": "Spending more time on health enhancing activities has diminishing marginal returns in terms of reduction in sick time"}, {"key": "b", "text": "In Grossman’s model, health is a stock variable and activities can either increase, decrease or have no effect on that stock"}, {"key": "c", "text": "Productive time in Grossman’s model includes only time spent on health-enhancing activities or time spent working"}, {"key": "d", "text": "Grossman’s model explains how people allocate their time between different kinds of activities to optimize consumption of health and non-health goods and services"}], "answer": "c", "source": "Week 3 Assignment 3 - Ronit Hazarika.pdf"}, {"id": "w3q8", "week": 3, "number": 8, "question": "Which of the following is FALSE?", "options": [{"key": "a", "text": "The Oregon Medicaid experiment demonstrated that coverage reduced the incidence of large out-of-pocket expenditure on health"}, {"key": "b", "text": "The Oregon Medicaid experiment proved that healthcare consumption involves knowledge asymmetry"}, {"key": "c", "text": "Both the RAND HIE and the Oregon experiments show that outpatient care increases upon insurance coverage"}, {"key": "d", "text": "Both the RAND HIE and the Oregon experiments show that inpatient care increases upon insurance coverage"}], "answer": "b", "source": "Week 3 Assignment 3 - Ronit Hazarika.pdf"}, {"id": "w3q9", "week": 3, "number": 9, "question": "The Efficient Producer Hypothesis would imply that an effective way to increase the health status of a population would be to", "options": [{"key": "a", "text": "Increase access to education"}, {"key": "b", "text": "Decrease the price of healthcare"}, {"key": "c", "text": "Provide universal health insurance"}, {"key": "d", "text": "Tighten licensing of health professionals"}], "answer": "a", "source": "Week 3 Assignment 3 - Ronit Hazarika.pdf"}, {"id": "w3q10", "week": 3, "number": 10, "question": "The Productive Time Hypothesis states that", "options": [{"key": "a", "text": "People who spend their time more productively have better health"}, {"key": "b", "text": "People with better health at any time t make more productive use of time at time t"}, {"key": "c", "text": "Production of health directly affects time available for leisure"}, {"key": "d", "text": "Socioeconomic status can be affected by the status of health of an individual"}], "answer": "d", "source": "Week 3 Assignment 3 - Ronit Hazarika.pdf"}, {"id": "w4q1", "week": 4, "number": 1, "question": "Which of the following play the role of an ‘agent’ for the patient-consumer?", "options": [{"key": "a", "text": "Healthcare providers"}, {"key": "b", "text": "Healthcare suppliers"}, {"key": "c", "text": "Both healthcare providers and suppliers"}, {"key": "d", "text": "Neither healthcare providers and suppliers"}], "answer": "a", "source": "Week 4 Assignment 4 - Ronit Hazarika.pdf"}, {"id": "w4q2", "week": 4, "number": 2, "question": "Which of the following is TRUE?", "options": [{"key": "a", "text": "Higher the decline in marginal utility of income, greater the convexity of the income utility function"}, {"key": "b", "text": "Greater the concavity of the income utility function, higher the decline in marginal utility of income"}, {"key": "c", "text": "Greater the concavity of the income utility function, higher the marginal utility of income"}, {"key": "d", "text": "Greater the convexity of the income utility function, lower the marginal utility income"}], "answer": "b", "source": "Week 4 Assignment 4 - Ronit Hazarika.pdf"}, {"id": "w4q3", "week": 4, "number": 3, "question": "Which of the following is TRUE?", "options": [{"key": "a", "text": "Care providers in a healthcare market must be physicians"}, {"key": "b", "text": "The final product of a physician firm is treatment, not diagnostics or referrals"}, {"key": "c", "text": "Like in other firms, physician firms choose a least-cost combination of inputs to maximize profits"}, {"key": "d", "text": "None of the above"}], "answer": "d", "source": "Week 4 Assignment 4 - Ronit Hazarika.pdf"}, {"id": "w4q4", "week": 4, "number": 4, "question": "Which of the following are FALSE?", "options": [{"key": "a", "text": "The marginal utility of income directly proportional to income (by a constant k)"}, {"key": "b", "text": "Doctors sometimes prescribe more tests than necessary to maximize their profits"}, {"key": "c", "text": "As income decreases, the marginal utility of an extra unit of income decreases"}, {"key": "d", "text": "Doctors sometimes prescribe more tests than necessary to increase depreciation of fixed assets like diagnostic machines"}], "answer": "d", "source": "Week 4 Assignment 4 - Ronit Hazarika.pdf"}, {"id": "w4q5", "week": 4, "number": 5, "question": "Which of the following is FALSE?", "options": [{"key": "a", "text": "Doctors sometimes prescribe more tests than necessary to avoid the risk of being sued for medical malpractice"}, {"key": "b", "text": "As income increases, the marginal utility of an extra unit of income increases"}, {"key": "c", "text": "Doctors sometimes prescribe more tests than necessary to avoid conflicts with patient’s attendants"}, {"key": "d", "text": "As income increases, the marginal utility of an extra unit of income decreases"}], "answer": "d", "source": "Week 4 Assignment 4 - Ronit Hazarika.pdf"}, {"id": "w4q6", "week": 4, "number": 6, "question": "Which of the following is FALSE?", "options": [{"key": "a", "text": "As the expected utility from income decreases, individuals become more risk averse"}, {"key": "b", "text": "Income is not directly proportional to income utility by a constant k"}, {"key": "c", "text": "Risk aversion refers to the likelihood of taking risks"}, {"key": "d", "text": "Expected utility of income is the sum of the products of the probabilities of different incomes with their respective income utilities"}], "answer": "c", "source": "Week 4 Assignment 4 - Ronit Hazarika.pdf"}, {"id": "w4q7", "week": 4, "number": 7, "question": "Which of the following are NOT the characteristics of an actuarially fair insurance?", "options": [{"key": "a", "text": "Profit for the insurance firm"}, {"key": "b", "text": "Premiums equal expected payouts"}, {"key": "c", "text": "Zero administrative costs"}, {"key": "d", "text": "Risk pooling"}], "answer": "a", "source": "Week 4 Assignment 4 - Ronit Hazarika.pdf"}, {"id": "w4q8", "week": 4, "number": 8, "question": "Adverse selection is a consequence of", "options": [{"key": "a", "text": "Over-regulation"}, {"key": "b", "text": "Information Asymmetry"}, {"key": "c", "text": "Transaction costs"}, {"key": "d", "text": "Risk aversion"}], "answer": "b", "source": "Week 4 Assignment 4 - Ronit Hazarika.pdf"}, {"id": "w4q9", "week": 4, "number": 9, "question": "If a person drives faster than the speed limit because they know that their car has anti- lock braking systems, airbags and great safety mechanisms, it is an example of", "options": [{"key": "a", "text": "Decreasing individual utility"}, {"key": "b", "text": "Unfair market advantage"}, {"key": "c", "text": "Moral hazard"}, {"key": "d", "text": "Positive externality"}], "answer": "c", "source": "Week 4 Assignment 4 - Ronit Hazarika.pdf"}, {"id": "w4q10", "week": 4, "number": 10, "question": "Which of the following is NOT a strategy to reduce the moral hazard of insurance buyers?", "options": [{"key": "a", "text": "Randomizing the probability of payout in case of catastrophic health event"}, {"key": "b", "text": "Guiding behaviour of insurance buyers to minimize health risks"}, {"key": "c", "text": "Requiring patient assessments to prevent unnecessary medical expenditure"}, {"key": "d", "text": "Workplace programmes for health-maximization"}], "answer": "a", "source": "Week 4 Assignment 4 - Ronit Hazarika.pdf"}, {"id": "w5q1", "week": 5, "number": 1, "question": "In a study conducted at Guinea-Bissau, one of the countries with the poorest education, it was concluded that the quality of teaching was poor because", "options": [{"key": "a", "text": "teachers are isolated, underequipped and have little training"}, {"key": "b", "text": "teachers receive salaries after long delays"}, {"key": "c", "text": "teachers cannot use digital technologies"}, {"key": "d", "text": "both a and b"}, {"key": "e", "text": "both b and c"}], "answer": "d", "source": "Solution for W5 - NOC26 HS219.pdf"}, {"id": "w5q2", "week": 5, "number": 2, "question": "Fill in the blank: Standard theory of utility maximization predicts that the optimal demand for education will be when marginal utility of additional knowledge is _________ the marginal disutility of giving up alternative uses of the time involved", "options": [{"key": "a", "text": ">"}, {"key": "b", "text": "="}, {"key": "c", "text": "<"}, {"key": "d", "text": "All of the above"}], "answer": "b", "source": "Solution for W5 - NOC26 HS219.pdf"}, {"id": "w5q3", "week": 5, "number": 3, "question": "Identify the incorrect statement", "options": [{"key": "a", "text": "Human capital can be acquired mostly at the beginning of individual life"}, {"key": "b", "text": "Accumulation is determined by the pace of physiological factors"}, {"key": "c", "text": "Human capital can be resold"}, {"key": "d", "text": "The feature of human capital being embodied in human beings may lead to market failures."}], "answer": "c", "source": "Solution for W5 - NOC26 HS219.pdf"}, {"id": "w5q4", "week": 5, "number": 4, "question": "Which one is not a stage of investments in knowledge and skills?", "options": [{"key": "a", "text": "Childhood"}, {"key": "b", "text": "Teenagers and young adults"}, {"key": "c", "text": "After entering the labour market"}, {"key": "d", "text": "Retirement"}], "answer": "d", "source": "Solution for W5 - NOC26 HS219.pdf"}, {"id": "w5q5", "week": 5, "number": 5, "question": "Which one is not a form of Expected returns from education?", "options": [{"key": "a", "text": "Higher future earnings"}, {"key": "b", "text": "Increased job satisfaction"}, {"key": "c", "text": "Psychic losses"}, {"key": "d", "text": "Appreciation of non-market activities"}], "answer": "c", "source": "Solution for W5 - NOC26 HS219.pdf"}, {"id": "w5q6", "week": 5, "number": 6, "question": "Who received the Nobel prize for his research on the economic development of agriculture and his contributions to the understanding of how human capital affects economic growth and development?", "options": [{"key": "a", "text": "Theodore W. Schultz"}, {"key": "b", "text": "Amartya Sen"}, {"key": "c", "text": "Gary Becker"}, {"key": "d", "text": "None of the above"}], "answer": "a", "source": "Solution for W5 - NOC26 HS219.pdf"}, {"id": "w5q7", "week": 5, "number": 7, "question": "Mincer earnings function relates an individual's earnings to their", "options": [{"key": "a", "text": "Health"}, {"key": "b", "text": "Labour force participation"}, {"key": "c", "text": "Years of education and work experience"}, {"key": "d", "text": "Time use"}], "answer": "c", "source": "Solution for W5 - NOC26 HS219.pdf"}, {"id": "w5q8", "week": 5, "number": 8, "question": "Which one is not an input in production of education?", "options": [{"key": "a", "text": "Teachers and Staff"}, {"key": "b", "text": "Students"}, {"key": "c", "text": "Educational materials"}, {"key": "d", "text": "Skills and Competencies"}], "answer": "d", "source": "Solution for W5 - NOC26 HS219.pdf"}, {"id": "w5q9", "week": 5, "number": 9, "question": "Statement I: Demand for education has inverse relation with price/cost Statement II: Demand for education has positive relation with income", "options": [{"key": "a", "text": "Both statement I and II are correct"}, {"key": "b", "text": "Only statement I is correct"}, {"key": "c", "text": "Only statement II is correct"}, {"key": "d", "text": "None of statement I and II is correct"}], "answer": "a", "source": "Solution for W5 - NOC26 HS219.pdf"}, {"id": "w5q10", "week": 5, "number": 10, "question": "Which one is not an assessment domain of PISA?", "options": [{"key": "a", "text": "Reading Literacy"}, {"key": "b", "text": "Mathematics Literacy"}, {"key": "c", "text": "Social science literacy"}, {"key": "d", "text": "Science Literacy"}], "answer": "c", "source": "Solution for W5 - NOC26 HS219.pdf"}, {"id": "w6q1", "week": 6, "number": 1, "question": "Which one is not a characteristic of natural monopoly?", "options": [{"key": "a", "text": "High Fixed Costs"}, {"key": "b", "text": "High marginal costs"}, {"key": "c", "text": "Economies of Scale"}, {"key": "d", "text": "Non-Rivalrous Consumption"}], "answer": "b", "source": "Solution for W6 - NOC26 HS219.pdf"}, {"id": "w6q2", "week": 6, "number": 2, "question": "The provision for social goods, or the process by which total resource use is divided between private and social goods and by which the mix of social goods is chosen. This is called", "options": [{"key": "a", "text": "Allocation function"}, {"key": "b", "text": "Distribution function"}, {"key": "c", "text": "Stabilisation function"}, {"key": "d", "text": "Protection function"}], "answer": "a", "source": "Solution for W6 - NOC26 HS219.pdf"}, {"id": "w6q3", "week": 6, "number": 3, "question": "All individuals consume the same quantity of the good 𝐺, and one person's consumption does not reduce its availability to others. This is the case of", "options": [{"key": "a", "text": "Public goods"}, {"key": "b", "text": "Private goods"}, {"key": "c", "text": "Mixed goods"}, {"key": "d", "text": "Merit goods"}], "answer": "a", "source": "Solution for W6 - NOC26 HS219.pdf"}, {"id": "w6q4", "week": 6, "number": 4, "question": "What are the effects of a decision on a third party that are not taken into account by the decision- maker termed as?", "options": [{"key": "a", "text": "Social cost"}, {"key": "b", "text": "Externalities"}, {"key": "c", "text": "Market failure"}, {"key": "d", "text": "Private cost"}], "answer": "b", "source": "Solution for W6 - NOC26 HS219.pdf"}, {"id": "w6q5", "week": 6, "number": 5, "question": "Goods that are considered socially desirable by the government and are often provided or subsidized to ensure broader access.", "options": [{"key": "a", "text": "Public goods"}, {"key": "b", "text": "Private goods"}, {"key": "c", "text": "Mixed goods"}, {"key": "d", "text": "Merit goods"}], "answer": "d", "source": "Solution for W6 - NOC26 HS219.pdf"}, {"id": "w6q6", "week": 6, "number": 6, "question": "What are used to correct/internalize positive externality?", "options": [{"key": "a", "text": "Tax incentives"}, {"key": "b", "text": "Market incentives"}, {"key": "c", "text": "Subsidies"}, {"key": "d", "text": "Direct regulation"}], "answer": "c", "source": "Solution for W6 - NOC26 HS219.pdf"}, {"id": "w6q7", "week": 6, "number": 7, "question": "Effluent fees are charges imposed by governments on", "options": [{"key": "a", "text": "health care accessed"}, {"key": "b", "text": "the level of pollution created"}, {"key": "c", "text": "inefficient work done"}, {"key": "d", "text": "failure to pay tax on time"}], "answer": "b", "source": "Solution for W6 - NOC26 HS219.pdf"}, {"id": "w6q8", "week": 6, "number": 8, "question": "Quality of teaching and learning can deteriorate by mindlessly increasing quantity. This issue is called", "options": [{"key": "a", "text": "Excludability"}, {"key": "b", "text": "Rivalry"}, {"key": "c", "text": "Externalities"}, {"key": "d", "text": "Congestibility"}], "answer": "d", "source": "Solution for W6 - NOC26 HS219.pdf"}, {"id": "w6q9", "week": 6, "number": 9, "question": "Proposed by economists like Milton Friedman and further developed by Nicholas Barr and others, these are a mechanism where students borrow to finance their education and repay back based on their future income.", "options": [{"key": "a", "text": "Subsidies and Grants"}, {"key": "b", "text": "Income Contingent Loans"}, {"key": "c", "text": "Private Investment"}, {"key": "d", "text": "Personal savings"}], "answer": "b", "source": "Solution for W6 - NOC26 HS219.pdf"}, {"id": "w6q10", "week": 6, "number": 10, "question": "The cost of labor-intensive services like education tends to rise faster than other sectors due to slower productivity growth. This is explained by", "options": [{"key": "a", "text": "Baumol's cost disease"}, {"key": "b", "text": "Human capital theory"}, {"key": "c", "text": "Cost-Sharing Models"}, {"key": "d", "text": "Education Savings Accounts"}], "answer": "a", "source": "Solution for W6 - NOC26 HS219.pdf"}, {"id": "w7q1", "week": 7, "number": 1, "question": "The model considers multiple schooling levels and dynamic educational choices, allowing for the estimation of both direct and indirect benefits of schooling", "options": [{"key": "a", "text": "Sequential Schooling Model"}, {"key": "b", "text": "Multiple Schooling Model"}, {"key": "c", "text": "Progressive Schooling Model"}, {"key": "d", "text": "None of the above"}], "answer": "a", "source": "Solution for W7 - NOC26 HS219.pdf"}, {"id": "w7q2", "week": 7, "number": 2, "question": "Armed Services Vocational Aptitude Battery (ASVAB) is a standardized test used in which country to assess a candidate's suitability for enlistment in the Armed Forces", "options": [{"key": "a", "text": "India"}, {"key": "b", "text": "Unites States"}, {"key": "c", "text": "France"}, {"key": "d", "text": "Germany"}], "answer": "b", "source": "Solution for W7 - NOC26 HS219.pdf"}, {"id": "w7q3", "week": 7, "number": 3, "question": "When there is no correlation between parents' and children's earnings, it indicates", "options": [{"key": "a", "text": "High intergenerational mobility"}, {"key": "b", "text": "Low intergenerational mobility"}, {"key": "c", "text": "No intergenerational mobility"}, {"key": "d", "text": "Some intergenerational mobility"}], "answer": "a", "source": "Solution for W7 - NOC26 HS219.pdf"}, {"id": "w7q4", "week": 7, "number": 4, "question": "What measures the extent to which health care finance departs from proportionality?", "options": [{"key": "a", "text": "Human development index"}, {"key": "b", "text": "Kakwani’s progressivity index"}, {"key": "c", "text": "Concentration index"}, {"key": "d", "text": "Gini Coefficient"}], "answer": "b", "source": "Solution for W7 - NOC26 HS219.pdf"}, {"id": "w7q5", "week": 7, "number": 5, "question": "This type of health financing system is generally considered more equitable as it reduces the financial burden on lower-income groups and ensures that those with higher incomes contribute more", "options": [{"key": "a", "text": "Proportional"}, {"key": "b", "text": "Regressive"}, {"key": "c", "text": "Progressive"}, {"key": "d", "text": "Mixed"}], "answer": "c", "source": "Solution for W7 - NOC26 HS219.pdf"}, {"id": "w7q6", "week": 7, "number": 6, "question": "According to World Health Organization (WHO) Definition, Health care expenditure is considered catastrophic if a household’s out-of pocket payments for health care exceed what percentage of its capacity to pay?", "options": [{"key": "a", "text": "10%"}, {"key": "b", "text": "20%"}, {"key": "c", "text": "30%"}, {"key": "d", "text": "40%"}], "answer": "d", "source": "Solution for W7 - NOC26 HS219.pdf"}, {"id": "w7q7", "week": 7, "number": 7, "question": "According to Frances Stewart what kind of inequalities are particularly problematic because they can lead to social and political instability", "options": [{"key": "a", "text": "Vertical"}, {"key": "b", "text": "Horizontal"}, {"key": "c", "text": "Diagonal"}, {"key": "d", "text": "Circular"}], "answer": "b", "source": "Solution for W7 - NOC26 HS219.pdf"}, {"id": "w7q8", "week": 7, "number": 8, "question": "Well-being is a function of", "options": [{"key": "a", "text": "an individual’s family, social and societal circumstances"}, {"key": "b", "text": "their personal disposition"}, {"key": "c", "text": "the resources available to them"}, {"key": "d", "text": "All urce": "Solution for W8 - NOC26 HS219.pdf"}, {"id": "w8q4", "week": 8, "number": 4, "question": "The first stage of NEP 2020 which involved three years of early childhood education and two years of primary education, for children aged 3 to 8 is called", "options": [{"key": "a", "text": "Preparatory stage"}, {"key": "b", "text": "Foundational stage"}, {"key": "c", "text": "Development stage"}, {"key": "d", "text": "Basic stage"}], "answer": "b", "source": "Solution for W8 - NOC26 HS219.pdf"}, {"id": "w8q5", "week": 8, "number": 5, "question": "Which one of the following statements is NOT true in the context of EG West’s Public Choice Theory?", "options": [{"key": "a", "text": "West laid stress on the freedom of the individual."}, {"key": "b", "text": "Their interests can be sustained by the markets instead of by the state."}, {"key": "c", "text": "He argued that the monopoly of education by the state has adversely affected quality of education."}, {"key": "d", "text": "He favoured the British system of education."}], "answer": "d", "source": "Solution for W8 - NOC26 HS219.pdf"}, {"id": "w8q6", "week": 8, "number": 6, "question": "Which one is not one of the three major institutions of social coordination?", "options": [{"key": "a", "text": "the state"}, {"key": "b", "text": "the market"}, {"key": "c", "text": "the community"}, {"key": "d", "text": "private entities"}], "answer": "d", "source": "Solution for W8 - NOC26 HS219.pdf"}, {"id": "w8q7", "week": 8, "number": 7, "question": "IITs and IIMs must also produce scholars in other domains like linguistics, literature, political science etc and need to prevent isolation of study to engineering and management. This is a recommendation of", "options": [{"key": "a", "text": "National Education Policy 1986"}, {"key": "b", "text": "Acharya Ramamurthi Committee 1990"}, {"key": "c", "text": "Janadhana Reddy Committee 1990"}, {"key": "d", "text": "Committee on Higher Education 2009"}], "answer": "d", "source": "Solution for W8 - NOC26 HS219.pdf"}, {"id": "w8q8", "week": 8, "number": 8, "question": "In the context of education, these costs include the administrative costs of managing schools, negotiating contracts with teachers, or coordinating among different levels of government.", "options": [{"key": "a", "text": "Transportation costs"}, {"key": "b", "text": "Truncated costs"}, {"key": "c", "text": "Transaction costs"}, {"key": "d", "text": "True costs"}], "answer": "c", "source": "Solution for W8 - NOC26 HS219.pdf"}, {"id": "w8q9", "week": 8, "number": 9, "question": "Identify the correct statement.", "options": [{"key": "a", "text": "The Constitution of India does not explicitly mention the \"Right to Health\" as a fundamental right."}, {"key": "b", "text": "Article 19 is about Right to Life and Personal Liberty"}, {"key": "c", "text": "The Government of Rajasthan has been the first state in India to enact a Right to Health Act."}, {"key": "d", "text": "None of the above"}], "answer": "a", "source": "Solution for W8 - NOC26 HS219.pdf"}, {"id": "w8q10", "week": 8, "number": 10, "question": "Deployment of Accredited Social Health Activists (ASHAs) to increase health awareness, facilitate access to services, and empower communities, particularly in rural and underserved areas comes under", "options": [{"key": "a", "text": "National Digital Health Mission (NDHM)"}, {"key": "b", "text": "Mission Indradhanush"}, {"key": "c", "text": "Community-Based Health Initiatives"}, {"key": "d", "text": "Ayushman Bharat Scheme"}], "answer": "c", "source": "Solution for W8 - NOC26 HS219.pdf"}, {"id": "w9q1", "week": 9, "number": 1, "question": "GBD study classifies the world into: -", "options": [{"key": "a", "text": "32 regions and 8 super regions"}, {"key": "b", "text": "21 regions and 7 super regions"}, {"key": "c", "text": "27 regions and 9 super regions"}, {"key": "d", "text": "12 regions and 6 super regions"}], "answer": "b", "source": "W09A09 - Kumar Harsh.pdf"}, {"id": "w9q2", "week": 9, "number": 2, "question": "What was the primary objective of GBD study?", "options": [{"key": "a", "text": "The primary objective of the GBD study was to evaluate the performance of hospitals and health systems across regions."}, {"key": "b", "text": "The primary objective of the GBD study was to estimate healthcare expenditure and medical infrastructure across regions."}, {"key": "c", "text": "The primary objective of the GBD study was to give a picture of disease burden, risk factors and injuries across regions."}, {"key": "d", "text": "The primary objective of the GBD study was to compare the quality of health services provided by different countries."}], "answer": "c", "source": "W09A09 - Kumar Harsh.pdf"}, {"id": "w9q3", "week": 9, "number": 3, "question": "What is Disability adjusted Life Years metric?", "options": [{"key": "a", "text": "DALY(s) is a summation of years of life lost and years lived with disability, to quantify the impact of health issues"}, {"key": "b", "text": "DALY(s) is the difference between years of life lost and years lived with disability to quantify the impact of health issues."}, {"key": "c", "text": "DALY(s) measures only the years of life lost due to premature death to quantify the impact of health issues."}, {"key": "d", "text": "DALY(s) is a summation of healthy years lived and years lived with disability to quantify the impact of health issues"}], "answer": "a", "source": "W09A09 - Kumar Harsh.pdf"}, {"id": "w9q4", "week": 9, "number": 4, "question": "Which of the following is NOT the basis of GBD classification of regions?", "options": [{"key": "a", "text": "Historical ties"}, {"key": "b", "text": "Socioeconomic characteristics"}, {"key": "c", "text": "Geographic closeness"}, {"key": "d", "text": "Epidemiological similarity"}], "answer": "a", "source": "W09A09 - Kumar Harsh.pdf"}, {"id": "w9q5", "week": 9, "number": 5, "question": "As per 2021 data, for Ages 15-19, (both male and female) what is the largest cause of DALYs in India.", "options": [{"key": "a", "text": "COVID 19"}, {"key": "b", "text": "Depressive Disorders"}, {"key": "c", "text": "Road Injury"}, {"key": "d", "text": "Self-harm"}], "answer": "d", "source": "W09A09 - Kumar Harsh.pdf"}, {"id": "w9q6", "week": 9, "number": 6, "question": "Which of these states were not a part of PROBE survey?", "options": [{"key": "a", "text": "Bihar"}, {"key": "b", "text": "Uttar Pradesh"}, {"key": "c", "text": "Chhattisgarh"}, {"key": "d", "text": "Rajasthan"}], "answer": "c", "source": "W09A09 - Kumar Harsh.pdf"}, {"id": "w9q7", "week": 9, "number": 7, "question": "Which of the following is a key finding of PROBE report?", "options": [{"key": "a", "text": "A key finding was that poor families preferred work over schooling for all children."}, {"key": "b", "text": "A key finding was that poor families wanted to send their children to school."}, {"key": "c", "text": "A key finding of the report was that poor parents did not want to send their children to school."}, {"key": "d", "text": "A key finding of the report was that most parents did not think education was important for children."}], "answer": "b", "source": "W09A09 - Kumar Harsh.pdf"}, {"id": "w9q8", "week": 9, "number": 8, "question": "What is the full form of ASER?", "options": [{"key": "a", "text": "Annual Survey of Education Report"}, {"key": "b", "text": "Annual Status of Education Report"}, {"key": "c", "text": "Assessment of School Enrolment and Retention"}, {"key": "d", "text": "Annual Study of Student Achievement Report"}], "answer": "b", "source": "W09A09 - Kumar Harsh.pdf"}, {"id": "w9q9", "week": 9, "number": 9, "question": "What does the ASER evaluate?", "options": [{"key": "a", "text": "Students' attendance and school enrolment"}, {"key": "b", "text": "School infrastructure and classroom facilities"}, {"key": "c", "text": "Teachers' qualifications and classroom teaching"}, {"key": "d", "text": "Foundational literacy and numeracy skills"}], "answer": "d", "source": "W09A09 - Kumar Harsh.pdf"}, {"id": "w9q10", "week": 9, "number": 10, "question": "What is ASER?", "options": [{"key": "a", "text": "A government survey conducted by the Ministry of Education to assess school performance."}, {"key": "b", "text": "A citizen-led household survey conducted by local volunteers under the leadership of Pratham."}, {"key": "c", "text": "A national examination conducted every year to test students in government schools."}, {"key": "d", "text": "A survey conducted by the National Sample Survey Office to estimate literacy rates."}], "answer": "b", "source": "W09A09 - Kumar Harsh.pdf"}, {"id": "w10q1", "week": 10, "number": 1, "question": "What is the name of the government agency that conducts various socio- economic surveys in India?", "options": [{"key": "a", "text": "The Census office"}, {"key": "b", "text": "National Statistical Office"}, {"key": "c", "text": "NITI Aayog"}, {"key": "d", "text": "Indian Council of Social Science Research"}], "answer": "b", "source": "W10A10 - Kumar Harsh.pdf"}, {"id": "w10q2", "week": 10, "number": 2, "question": "Which ministry oversees the National Family Health Survey in India?", "options": [{"key": "a", "text": "Ministry of Women and Child Development"}, {"key": "b", "text": "Ministry of Health and Family Welfare"}, {"key": "c", "text": "Ministry of Statistics and Programme Implementation"}, {"key": "d", "text": "Ministry of Rural Development"}], "answer": "b", "source": "W10A10 - Kumar Harsh.pdf"}, {"id": "w10q3", "week": 10, "number": 3, "question": "Which ministry conducts the National Sample Survey in India?", "options": [{"key": "a", "text": "Ministry of Home Affairs"}, {"key": "b", "text": "Ministry of Health and Family Welfare"}, {"key": "c", "text": "Ministry of Statistics and Programme Implementation."}, {"key": "d", "text": "Ministry of Human Development"}], "answer": "c", "source": "W10A10 - Kumar Harsh.pdf"}, {"id": "w10q4", "week": 10, "number": 4, "question": "Which of the following statements about UDISE+ is true?", "options": [{"key": "a", "text": "Under UDISE+ schools submit their details only after it has been verified by a Central Government officer."}, {"key": "b", "text": "Under UDISE+ details are collected through a nationwide sample survey of selected schools to obtain representative estimates."}, {"key": "c", "text": "Under UDISE+ schools report details like number of teachers, students, infrastructure facilities using Data Capture Forms."}, {"key": "d", "text": "Under UDISE+, data is compiled only from government schools, while private schools are covered through a different survey."}], "answer": "c", "source": "W10A10 - Kumar Harsh.pdf"}, {"id": "w10q5", "week": 10, "number": 5, "question": "Which body conducts India Human Development Survey?", "options": [{"key": "a", "text": "International Institute for Population Sciences (IIPS), Mumbai"}, {"key": "b", "text": "University of Oxford, United Kingdom"}, {"key": "c", "text": "Ministry of Human Development"}, {"key": "d", "text": "National Council of Applied Economic Research (NCAER) and the University of Maryland, USA"}], "answer": "d", "source": "W10A10 - Kumar Harsh.pdf"}, {"id": "w10q6", "week": 10, "number": 6, "question": "Which of the following is an official data source?", "options": [{"key": "a", "text": "National Non-Communicable Diseases Monitoring Survey"}, {"key": "b", "text": "India Human Development Survey"}, {"key": "c", "text": "Annual Status of Education Report"}, {"key": "d", "text": "Consumer Pyramids Household Survey"}], "answer": "a", "source": "W10A10 - Kumar Harsh.pdf"}, {"id": "w10q7", "week": 10, "number": 7, "question": "Which of the following statements about verification of data uploaded in the UDISE+ database is true?", "options": [{"key": "a", "text": "The data uploaded by schools to the UDISE+ database undergoes verification and validation at the block, district, and state level."}, {"key": "b", "text": "The data uploaded by schools are verified centrally by officials of the Ministry of Education before being incorporated into the UDISE+ database."}, {"key": "c", "text": "District Education Officers and District Magistrates are responsible for certifying the accuracy of all data uploaded by schools before submission to the UDISE+ database."}, {"key": "d", "text": "The Ministry of Education appoints dedicated verification officers to independently validate the data reported by every school before publication."}], "answer": "a", "source": "W10A10 - Kumar Harsh.pdf"}, {"id": "w10q8", "week": 10, "number": 8, "question": "What does AISHE aim to assess/provide?", "options": [{"key": "a", "text": "AISHE aims to assess the learning outcomes of university students through standardized national tests."}, {"key": "b", "text": "AISHE aims to assess the quality of teaching and other infrastructural facilities at Higher Education Institutes."}, {"key": "c", "text": "AISHE aims to provide comprehensive and reliable data on higher education institutions in India."}, {"key": "d", "text": "AISHE aims to rank higher education institutions according to research output and employability."}], "answer": "c", "source": "W10A10 - Kumar Harsh.pdf"}, {"id": "w10q9", "week": 10, "number": 9, "question": "Which of the following sentences is true?", "options": [{"key": "a", "text": "Mortality data indicate the occurrence of death, while morbidity data provides information on incidence and prevalence of diseases, together offering a more complete picture."}, {"key": "b", "text": "Mortality and morbidity data are collected primarily to validate each other, as both measure the same health outcomes."}, {"key": "c", "text": "Mortality data are of limited value because morbidity surveys alone provide sufficient information on the health status of a population."}, {"key": "d", "text": "Mortality data cannot be used for public health planning because they do not provide information on disease prevalence."}], "answer": "a", "source": "W10A10 - Kumar Harsh.pdf"}, {"id": "w10q10", "week": 10, "number": 10, "question": "Which of the following rounds of NSO – NSS is INCORRECTLY matched?", "options": [{"key": "a", "text": "71st Round - Consumption of health services by households"}, {"key": "b", "text": "75th Round - Detailed information on morbidity including social consumption"}, {"key": "c", "text": "87th Round - Comprehensive survey on private hospitals"}, {"key": "d", "text": "60th Round - Economic impact of healthcare, focusing on NCDs"}], "answer": "c", "source": "W10A10 - Kumar Harsh.pdf"}, {"id": "w11q1", "week": 11, "number": 1, "question": "What is assessed using Kakwani Index?", "options": [{"key": "a", "text": "Equity in education financing"}, {"key": "b", "text": "Equity in health financing"}, {"key": "c", "text": "Equity in agricultural financing"}, {"key": "d", "text": "Equity in infrastructure financing"}], "answer": "b", "source": "W11A11 - Rajshree Bedamatta.pdf"}, {"id": "w11q2", "week": 11, "number": 2, "question": "What comprises a Health System?", "options": [{"key": "a", "text": "A health system encompasses all organizations, people, and actions whose primary intent is to promote, restore, or maintain health."}, {"key": "b", "text": "A health system comprises only hospitals, clinics, and other healthcare facilities providing medical treatment."}, {"key": "c", "text": "A health system comprises all activities undertaken by the Ministry of Health and Family Welfare to improve public health."}, {"key": "d", "text": "A health system comprises only healthcare professionals involved in the diagnosis, and treatment of diseases."}], "answer": "a", "source": "W11A11 - Rajshree Bedamatta.pdf"}, {"id": "w11q3", "week": 11, "number": 3, "question": "What is Health Financing?", "options": [{"key": "a", "text": "Health financing refers to the process of preparing and approving annual budgets for hospitals and health departments."}, {"key": "b", "text": "Health financing refers to the auditing and financial accounting of expenditure incurred by healthcare institutions."}, {"key": "c", "text": "Health financing refers to the procurement and financial management of medicines, equipment, and other medical supplies."}, {"key": "d", "text": "Health financing deals with how financial resources for healthcare are generated, pooled, allocated, and spent, including who contributes these resources and on whom they are ultimately spent."}], "answer": "d", "source": "W11A11 - Rajshree Bedamatta.pdf"}, {"id": "w11q4", "week": 11, "number": 4, "question": "Which of the following is NOT a determinant of health financing?", "options": [{"key": "a", "text": "Economic activity"}, {"key": "b", "text": "Environmental factors"}, {"key": "c", "text": "Demographic profile"}, {"key": "d", "text": "Trade balance"}], "answer": "d", "source": "W11A11 - Rajshree Bedamatta.pdf"}, {"id": "w11q5", "week": 11, "number": 5, "question": "Which of the following correctly describes Out of Pocket Expenditures?", "options": [{"key": "a", "text": "Out-of-pocket expenditure refers to the direct expenditure incurred by individuals or households on food and other essential commodities from their own financial resources."}, {"key": "b", "text": "Out-of-pocket expenditure refers to the direct expenditure incurred by individuals or households on various services consumed by households during the process of production."}, {"key": "c", "text": "Out-of-pocket expenditure refers to the direct expenditure incurred by individuals or households on healthcare services from their own resources, without reimbursement from insurance or any other third- party payer."}, {"key": "d", "text": "Out-of-pocket expenditure refers to the direct expenditure incurred by individuals or households on non-food goods and household consumption from their own financial resources."}], "answer": "c", "source": "W11A11 - Rajshree Bedamatta.pdf"}, {"id": "w11q6", "week": 11, "number": 6, "question": "Which of the following is the most equitable form of health financing?", "options": [{"key": "a", "text": "Tax financing"}, {"key": "b", "text": "Social health insurance"}, {"key": "c", "text": "Community health insurance"}, {"key": "d", "text": "Household’s health savings account"}], "answer": "a", "source": "W11A11 - Rajshree Bedamatta.pdf"}, {"id": "w11q7", "week": 11, "number": 7, "question": "Which of the following are correct approaches to ascertain whether health expenditures are catastrophic?", "options": [{"key": "a", "text": "Income and expenditure approach"}, {"key": "b", "text": "Consumption and budgeting approach"}, {"key": "c", "text": "Income and reimbursement approach"}, {"key": "d", "text": "Income and consumption approach"}], "answer": "d", "source": "W11A11 - Rajshree Bedamatta.pdf"}, {"id": "w11q8", "week": 11, "number": 8, "question": "What is WHO’s recommended level of overall public spending on healthcare?", "options": [{"key": "a", "text": "12%"}, {"key": "b", "text": "5%"}, {"key": "c", "text": "11.5%"}, {"key": "d", "text": "9%"}], "answer": "b", "source": "W11A11 - Rajshree Bedamatta.pdf"}, {"id": "w11q9", "week": 11, "number": 9, "question": "Why is education termed as a quasi-public good?", "options": [{"key": "a", "text": "Education is termed a quasi-public good because it yields both private returns and social benefits."}, {"key": "b", "text": "Education is termed a quasi-public good because its benefits are enjoyed only by society and not by the individual receiving it."}, {"key": "c", "text": "Education is termed a quasi-public good because it is provided by both government and private institutions."}, {"key": "d", "text": "Education is termed a quasi-public good because it is available free of cost but the quality of free education is often inferior."}], "answer": "a", "source": "W11A11 - Rajshree Bedamatta.pdf"}, {"id": "w11q10", "week": 11, "number": 10, "question": "Which of the following is NOT a dominant framework with regard to education financing?", "options": [{"key": "a", "text": "Human Capital Theory"}, {"key": "b", "text": "Screening model of higher education"}, {"key": "c", "text": "Liberal model of education"}, {"key": "d", "text": "Marxist approach to education"}], "answer": "c", "source": "W11A11 - Rajshree Bedamatta.pdf"}, {"id": "w12q1", "week": 12, "number": 1, "question": "Which of the following is NOT a framework used to analyse healthcare workforce?", "options": [{"key": "a", "text": "Stock flow model of healthcare labour force"}, {"key": "b", "text": "Wage determination model of healthcare labour force"}, {"key": "c", "text": "WHO health labour market framework"}, {"key": "d", "text": "Doctors Without Borders/ Médecins Sans Frontières (MSF) framework"}], "answer": "d", "source": "W12A12 - Rajshree Bedamatta.pdf"}, {"id": "w12q2", "week": 12, "number": 2, "question": "According to the World Health Report of 2006, what was a key finding regarding health workers?", "options": [{"key": "a", "text": "As the density of health workers increases, the probability of survival of infants, children, and mothers also increases."}, {"key": "b", "text": "Relying solely on market forces and flexible wage adjustments is the most effective strategy to address national health system needs."}, {"key": "c", "text": "Health management and support workers must constitute at least 70% of the global health workforce to ensure adequate administrative capacity."}, {"key": "d", "text": "Setting the minimum wage of health workers above the equilibrium level automatically eliminates the geographic maldistribution of the workforce."}], "answer": "a", "source": "W12A12 - Rajshree Bedamatta.pdf"}, {"id": "w12q3", "week": 12, "number": 3, "question": "Which of the following best describes the WHO health labour market analysis framework?", "options": [{"key": "a", "text": "A dynamic system focused primarily on assessing the total number of healthcare workers over time by measuring inflows, like new graduates, and outflows, like retirements."}, {"key": "b", "text": "A traditional economic model demonstrating that workforce demand is strictly determined by the interaction between equilibrium wage levels and the quantity of workers employers are willing to hire."}, {"key": "c", "text": "An analytical approach based on marginal productivity, asserting that healthcare institutions will only hire staff up to the point where their wage equals the marginal revenue they generate."}, {"key": "d", "text": "A comprehensive model that goes beyond traditional supply and demand by incorporating health system needs, regulations, employment conditions, and broader socio-economic influences."}], "answer": "d", "source": "W12A12 - Rajshree Bedamatta.pdf"}, {"id": "w12q4", "week": 12, "number": 4, "question": "Which of the following best describes the stock flow model?", "options": [{"key": "a", "text": "A dynamic system focused primarily on assessing the total number of healthcare workers over time by measuring inflows, like new graduates, and outflows, like retirements."}, {"key": "b", "text": "A traditional economic model demonstrating that workforce demand is strictly determined by the interaction between equilibrium wage levels and the quantity of workers employers are willing to hire."}, {"key": "c", "text": "An analytical approach based on marginal productivity, asserting that healthcare institutions will only hire staff up to the point where their wage equals the marginal revenue they generate."}, {"key": "d", "text": "A comprehensive model that goes beyond traditional supply and demand by incorporating health system needs, regulations, employment conditions, and broader socio-economic influences."}], "answer": "a", "source": "W12A12 - Rajshree Bedamatta.pdf"}, {"id": "w12q5", "week": 12, "number": 5, "question": "Which of the following best describes the wage determination model?", "options": [{"key": "a", "text": "A dynamic system focused primarily on assessing the total number of healthcare workers over time by measuring inflows, like new graduates, and outflows, like retirements."}, {"key": "b", "text": "A traditional economic model demonstrating that workforce demand is strictly determined by the quality of health workforce being produced by educational institutions."}, {"key": "c", "text": "An analytical approach based on marginal productivity, asserting that healthcare institutions will only hire staff up to the point where their wage equals the marginal revenue they generate."}, {"key": "d", "text": "A comprehensive model that goes beyond traditional supply and demand by incorporating health system needs, regulations, employment conditions, and broader socio-economic influences."}], "answer": "c", "source": "W12A12 - Rajshree Bedamatta.pdf"}, {"id": "w12q6", "week": 12, "number": 6, "question": "What was the title of 2006 World Health Report?", "options": [{"key": "a", "text": "Investing in Health Workers"}, {"key": "b", "text": "Working Together for Health"}, {"key": "c", "text": "Strengthening Global Health Systems"}, {"key": "d", "text": "Empowering the Health Workforce"}], "answer": "b", "source": "W12A12 - Rajshree Bedamatta.pdf"}, {"id": "w12q7", "week": 12, "number": 7, "question": "What was the target set by SDG with regard to expenditure on Education?", "options": [{"key": "a", "text": "6 percent of the total GDP"}, {"key": "b", "text": "4 percent of the total GDP"}, {"key": "c", "text": "3 percent of the total GDP"}, {"key": "d", "text": "8 percent of the total GDP"}], "answer": "a", "source": "W12A12 - Rajshree Bedamatta.pdf"}, {"id": "w12q8", "week": 12, "number": 8, "question": "We see a near universal enrolment rate in", "options": [{"key": "a", "text": "Higher Secondary education"}, {"key": "b", "text": "Higher education"}, {"key": "c", "text": "Elementary and Lower Secondary education"}, {"key": "d", "text": "Elementary education"}], "answer": "d", "source": "W12A12 - Rajshree Bedamatta.pdf"}, {"id": "w12q9", "week": 12, "number": 9, "question": "What is the primary distinction between the \"labour force\" and the \"workforce\"?", "options": [{"key": "a", "text": "The workforce encompasses all individuals in the working-age population (15-59 years), while the labour force only includes those who are currently employed."}, {"key": "b", "text": "The labour force includes people who are either in paid employment or actively seeking work, whereas the workforce is a smaller subset consisting only of those currently in paid employment or unpaid work for market."}, {"key": "c", "text": "The labour force consists exclusively of individuals working in the formal sector, whereas the workforce comprises people working in both formal and informal sectors."}, {"key": "d", "text": "The labour force includes people actively pursuing education or doing unpaid domestic work, while the workforce excludes them."}], "answer": "b", "source": "W12A12 - Rajshree Bedamatta.pdf"}, {"id": "w12q10", "week": 12, "number": 10, "question": "High unemployment rate and absence from the labour market among highly educated urban female youth primarily indicate which of the following socio-economic conditions?", "options": [{"key": "a", "text": "A demographic dividend, where the sudden surge in young educated women has temporarily overwhelmed the job market's capacity."}, {"key": "b", "text": "A strict supply-side bottleneck, where households universally restrict educated women from seeking work despite an abundance of available formal jobs."}, {"key": "c", "text": "A demand-side constraint, where firms and the labour market are failing to adequately create opportunities for women's labour due to lack of adequate work or systemic biases."}, {"key": "d", "text": "An underemployment equilibrium, where highly educated women are exclusively transitioning into the unorganized agricultural sector."}], "answer": "c", "source": "W12A12 - Rajshree Bedamatta.pdf"}];</script><script>const $=s=>document.querySelector(s), app=$('#app');

function home(){clearInterval(interval);session=null;const done=new Set(history.filter(x=>x.week&&x.total===10).map(x=>x.week));app.innerHTML=`<div class="hero"><div><div class="eyebrow">YOUR PERSONAL STUDY SPACE</div><h1>A little practice.<br>A lot more confidence.</h1><p>Master Economics of Health and Education, one week at a time. Practice a section or bring everything together in a full test.</p></div><div class="full"><div class="eyebrow">THE COMPLETE CHALLENGE</div><h2>Ready for the full picture?</h2><p>All 12 weeks. All 120 questions.<br>One focused test to see where you stand.</p><button onclick="start(null,'test')">Start full test &nbsp; ↗</button><p class="note">120 minutes · Answers revealed after submission</p></div></div><div class="stats"><div class="stat"><strong>120</strong><span>worksheet questions</span></div><div class="stat"><strong>12</strong><span>weekly sections</span></div><div class="stat"><strong>${done.size}/12</strong><span>sections completed</span></div></div>${saved?`<div class="toolbar"><button class="primary" onclick="resume()">Resume unfinished ${saved.mode==='test'?'test':'practice'} →</button><span>${Object.keys(saved.answers).length} of ${saved.ids.length} answered</span><button onclick="discard()">Discard</button></div>`:''}<div class="section-head"><div><div class="eyebrow">BUILD YOUR UNDERSTANDING</div><h2>Choose your weekly section</h2></div><p>10 questions per week · 1 point each</p></div><div class="toolbar"><label>Section mode <select id="mode"><option value="practice">Practice · check as you go</option><option value="test">Test · answers at the end</option></select></label><label><input id="shuffle" type="checkbox"> Shuffle questions</label></div><div class="grid">${topics.map((t,i)=>{let best=history.filter(h=>h.week===i+1&&h.total===10).sort((a,b)=>b.score-a.score)[0];return `<article class="card"><div class="week">WEEK ${String(i+1).padStart(2,'0')}${best?`<span class="badge">Best ${best.score}/10</span>`:''}</div><h3>${t}</h3><p>Assignment ${i+1} · 10 questions</p><button onclick="start(${i+1},$('#mode').value)">Start section <span>→</span></button></article>`}).join('')}</div>${history.length?`<div class="section-head" style="margin-top:35px"><h2>Recent attempts</h2></div>${history.slice(0,5).map(h=>`<p>${h.week?'Week '+h.week:'Full test'} · ${h.mode} · <b>${h.score}/${h.total}</b> · ${new Date(h.date).toLocaleDateString()}</p>`).join('')}`:''}`;window.scrollTo(0,0)}
function discard(){saved=null;try{localStorage.removeItem('ps-session')}catch{}home()}
function start(week,mode){if(saved&&!confirm('Starting a new attempt will replace your unfinished attempt. Continue?'))return;let qs=QUESTIONS.filter(q=>!week||q.week===week);if($('#shuffle')?.checked)qs=shuffle(qs);session={week,mode,ids:qs.map(q=>q.id),answers:{},checked:{},flags:{},index:0,started:Date.now(),end:mode==='test'?Date.now()+qs.length*60000:null};save();quiz();clockStart()}
function resume(){session=saved;quiz();clockStart()}
function clockStart(){clearInterval(interval);tick();interval=setInterval(tick,1000)}
function tick(){if(!session)return;if(session.end&&Date.now()>=session.end){finish(true);return}let el=$('#timer');if(el){let seconds=Math.max(0,Math.floor(((session.end||Date.now())-(session.end?Date.now():session.started))/1000));el.textContent=`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`}}
function question(){return QUESTIONS.find(q=>q.id===session.ids[session.index])}
function quiz(){let q=question(),checked=session.checked[q.id],answered=Object.keys(session.answers).length;app.innerHTML=`<div class="section-head"><div><div class="eyebrow">${session.week?'WEEK '+session.week:'ALL 12 WEEKS'} / ${session.mode.toUpperCase()}</div><h2>${session.week?topics[session.week-1]:'Full worksheet test'}</h2></div><button onclick="home()">Save & exit</button></div><div class="quiz-layout"><section class="question"><div class="eyebrow">QUESTION ${session.index+1} OF ${session.ids.length} <span style="float:right">W${q.week} · Q${q.number}</span></div><div class="progress"><span style="width:${answered/session.ids.length*100}%"></span></div><h2>${esc(q.question)}</h2>${q.options.map(o=>`<button class="option ${session.answers[q.id]===o.key?'selected':''} ${checked&&o.key===q.answer?'correct':''} ${checked&&session.answers[q.id]===o.key&&o.key!==q.answer?'wrong':''}" onclick="choose('${o.key}')" ${checked?'disabled':''}><span class="letter">${o.key.toUpperCase()}</span><span>${esc(o.text)}</span></button>`).join('')}${checked?`<div class="feedback" role="status"><b>${session.answers[q.id]===q.answer?'Correct. Nicely done!':'Keep going — the correct answer is '+q.answer.toUpperCase()+'.'}</b><br>${esc(q.options.find(o=>o.key===q.answer).text)}<p class="note">Source: ${esc(q.source)} · Question ${q.number}</p>${q.week===4&&[4,5].includes(q.number)?'<p class="warning">This supplied answer key appears inconsistent with the question wording. The worksheet answer is preserved for scoring.</p>':''}</div>`:''}<div class="actions"><button onclick="move(-1)" ${session.index===0?'disabled':''}>← Previous</button>${session.mode==='practice'?`<button class="primary" onclick="check()" ${!session.answers[q.id]||checked?'disabled':''}>Check answer</button>`:''}<button onclick="move(1)" ${session.index===session.ids.length-1?'disabled':''}>Next →</button></div></section><aside class="side"><div class="eyebrow">${session.end?'TIME REMAINING':'TIME SPENT'}</div><div id="timer" class="timer">—</div><p>${answered} answered · ${session.ids.length-answered} unanswered</p><div class="palette">${session.ids.map((id,i)=>`<button class="${i===session.index?'active':''} ${session.answers[id]?'done':''} ${session.flags[id]?'flag':''}" aria-label="Question ${i+1}${session.answers[id]?', answered':''}${session.flags[id]?', flagged':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div><p>Green = answered · Gold = flagged</p><button style="width:100%" onclick="flag()">${session.flags[q.id]?'Unflag question':'⚑ Flag for review'}</button><button class="primary" style="width:100%;margin-top:12px" onclick="finish()">Submit ${session.mode==='test'?'test':'practice'}</button><p>1 point per correct answer.<br>No negative marking. Skipped answers earn 0.</p></aside></div>`;tick()}
function choose(key){let q=question();if(session.checked[q.id])return;session.answers[q.id]=key;save();quiz()}
function check(){session.checked[question().id]=true;save();quiz()}
function move(n){jump(session.index+n)}function jump(i){session.index=i;save();quiz()}function flag(){let id=question().id;session.flags[id]=!session.flags[id];save();quiz()}
function finish(expired=false){let unanswered=session.ids.length-Object.keys(session.answers).length;if(!expired&&!confirm(`Submit this attempt? ${unanswered?unanswered+' questions are unanswered.':'All questions are answered.'}`))return;clearInterval(interval);const s=session;const qs=s.ids.map(id=>QUESTIONS.find(q=>q.id===id));const score=qs.filter(q=>s.answers[q.id]===q.answer).length;history.unshift({week:s.week,mode:s.mode,score,total:qs.length,date:Date.now()});history=history.slice(0,100);try{localStorage.setItem('ps-history',JSON.stringify(history));localStorage.removeItem('ps-session')}catch{}saved=null;session=null;app.innerHTML=`<div class="result-top"><div class="eyebrow" style="color:var(--lime)">${expired?'TIME IS UP':'ATTEMPT COMPLETE'}</div><h1>${score} <span style="font-size:28px">/ ${qs.length}</span></h1><h2>${Math.round(score/qs.length*100)}% accuracy</h2><p>${score} correct · ${qs.length-score-unanswered} incorrect · ${unanswered} skipped</p><button onclick="home()">Back to sections</button> <button onclick="retry()">Retry missed questions</button></div><div class="section-head"><h2>Review your answers</h2><label><input id="missed" type="checkbox" onchange="document.querySelectorAll('.review[data-correct=true]').forEach(e=>e.hidden=this.checked)"> Only missed</label></div>${!s.week?`<div class="grid">${topics.map((t,i)=>{let w=qs.filter(q=>q.week===i+1);return w.length?`<div class="card"><span class="week">WEEK ${i+1}</span><h3>${w.filter(q=>s.answers[q.id]===q.answer).length}/${w.length}</h3><span>${t}</span></div>`:''}).join('')}</div>`:''}${qs.map(q=>`<details class="card review" data-correct="${s.answers[q.id]===q.answer}"><summary>${s.answers[q.id]===q.answer?'✓':'○'} Week ${q.week} · Q${q.number} — ${esc(q.question)}</summary><p>Your answer: ${s.answers[q.id]?esc(q.options.find(o=>o.key===s.answers[q.id]).text):'Skipped'}</p><p><b>Worksheet answer ${q.answer.toUpperCase()}: ${esc(q.options.find(o=>o.key===q.answer).text)}</b></p><p class="note">${esc(q.source)}</p>${q.week===4&&[4,5].includes(q.number)?'<p class="warning">The supplied key appears inconsistent with the wording. Scoring follows the worksheet.</p>':''}</details>`).join('')}`;window.retry=()=>{let ids=qs.filter(q=>s.answers[q.id]!==q.answer).map(q=>q.id);if(!ids.length){alert('You got everything right! Try another section.');return}session={week:s.week,mode:'practice',ids,answers:{},checked:{},flags:{},index:0,started:Date.now(),end:null};save();quiz();clockStart()};window.scrollTo(0,0)}
$('#home').onclick=home;$('#brand').onclick=e=>{e.preventDefault();home()};home();
</script></body></html>
